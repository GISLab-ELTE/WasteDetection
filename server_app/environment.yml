name: WasteDetection-ServerApp
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # Core runtime
  - python=3.8.12
  - pip=21.2.4

  # ML / numeric stack (server_app + model/*)
  - pytorch=2.4.0
  - numpy=1.24.4
  - pandas=1.3.3
  - scikit-learn=0.24.2
  - scikit-image=0.19.0
  - scipy=1.10.1
  - pyproj=3.2.1

  # Geospatial stack
  - gdal=3.3.2
  - rasterio=1.2.8
  - geopandas=0.12.1
  - shapely=1.8.0
  - geojson=2.5.0

  # API / HTTP integrations (server_app/src/*.py)
  - requests=2.32.3
  - sentinelhub=3.11.1

  - pip:
      - jsonmerge==1.9.0
      - opencv-python-headless==4.5.3.56
