name: WasteDetection-WebAppBackend
channels:
  - conda-forge
  - defaults
dependencies:
  # Core runtime
  - python=3.8.12
  - pip=21.2.4

  # Flood forecasting helpers (web backend uses model/flood_prediction.py only)
  - pyproj=3.2.1

  # Geospatial stack
  - gdal=3.3.2
  - rasterio=1.2.8
  - geopandas=0.12.1
  - shapely=1.8.0

  # Flask backend stack (web_app/backend/*.py)
  - flask=2.2.5
  - flask-bcrypt=1.0.1
  - flask-login=0.6.3
  - flask-migrate=4.0.7
  - flask-sqlalchemy=2.5.1
  - python-dotenv=1.0.1
  - gunicorn=22.0.0
  - requests=2.32.3

  - pip:
      - flask-cors==4.0.1
      - geoalchemy2==0.14.6
      - psycopg2-binary==2.9.9
      - sqlalchemy==1.4.53
